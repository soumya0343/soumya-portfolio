<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Felt Notebook mark: olive felt tile, stitched seam, "SG" as tall narrow pixel
       letters in Handjet's proportions. Hand-drawn on a 5x9 grid rather than traced from
       the font: at favicon size Handjet's S and G close up and read as "86".
       Drawn as shapes because favicons can't load web fonts. -->
